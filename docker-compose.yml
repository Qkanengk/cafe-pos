services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe
      POSTGRES_DB: cafe
    volumes:
      - cafe_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cafe -d cafe']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://cafe:cafe@db:5432/cafe?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-local-development-only-change-before-production-32}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  cafe_data:
