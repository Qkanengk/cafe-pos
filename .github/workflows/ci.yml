name: CI
on:
  push:
    branches: [main, devin/cafe-pos-mvp]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cafe
          POSTGRES_PASSWORD: cafe
          POSTGRES_DB: cafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cafe -d cafe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://cafe:cafe@localhost:5432/cafe?schema=public
      AUTH_SECRET: ci-only-not-for-production-secret-at-least-32-characters
      BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Prepare fresh test database
        run: |
          npx prisma migrate deploy
          npm run db:seed
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start production standalone server
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > server.log 2>&1 &
      - name: Definition of Done E2E suite
        run: npm run test:e2e
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            playwright-report/
            test-results/
            server.log
          if-no-files-found: ignore
          retention-days: 7
